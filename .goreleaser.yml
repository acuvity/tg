version: 2
snapshot:
  version_template: "v{{ .Tag }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^examples:"
builds:
  - id: tg
    binary: tg
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -w -s -X 'go.acuvity.ai/a3s/pkgs/version.GitSha={{.Commit}}' -X 'go.acuvity.ai/a3s/pkgs/version.GitBranch=main' -X 'go.acuvity.ai/a3s/pkgs/version.GitTag={{.Version}}' -X 'go.acuvity.ai/a3s/pkgs/version.BuildDate={{.Date}}'

archives:
  - id: tg
    formats: ["zip"]
    builds:
      - tg

signs:
  - artifacts: checksum
    args:
      [
        "-u",
        "0C3214A61024881F5CA1F5F056EDB08A11DCE325",
        "--output",
        "${signature}",
        "--detach-sign",
        "${artifact}",
      ]

brews:
  - name: tg
    homepage: "https://github.com/acuvity/tg"
    description: Easy TLS certificate generation
    license: "Apache"
    repository:
      owner: acuvity
      name: homebrew-tap
    commit_author:
      name: goreleaserbot
      email: goreleaser@acuvity.ai
    directory: Formula
    install: |
      bin.install "tg"
    test: |
      system "#{bin}/tg", "--help"
